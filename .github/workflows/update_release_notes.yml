name: Update Release Notes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Python script
        run: python3 scripts/update_release_notes.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
